name: 桌面检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/build-engine.mjs
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - name: 构建 Windows x64 测试安装包（不代表签名发布）
        if: runner.os == 'Windows'
        run: npm exec electron-builder -- --win nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Windows'
        with:
          name: pinekin-windows-x64-test-installer
          path: release/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
